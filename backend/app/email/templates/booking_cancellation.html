<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:40px 0;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);">
      <tr><td style="background:#111827;padding:28px 40px;">
        <table width="100%"><tr>
          <td><span style="color:#ffffff;font-size:20px;font-weight:700;">{{ app_name }}</span></td>
          <td align="right"><span style="background:#ef4444;color:#ffffff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;">❌ CANCELLED</span></td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:40px;">
        <h1 style="margin:0 0 8px;font-size:24px;font-weight:700;color:#111827;">Your meeting has been cancelled</h1>
        <p style="margin:0 0 32px;color:#6b7280;font-size:15px;">Hi {{ booker_name }}, the following meeting has been cancelled.</p>
        <table width="100%" style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:0 0 32px;">
          <tr><td style="padding:24px;">
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr><td style="padding:8px 0;border-bottom:1px solid #fecaca;">
                <span style="color:#6b7280;font-size:13px;font-weight:500;display:block;margin-bottom:2px;">EVENT</span>
                <span style="color:#111827;font-size:15px;font-weight:600;text-decoration:line-through;color:#9ca3af;">{{ event_title }}</span>
              </td></tr>
              <tr><td style="padding:8px 0;border-bottom:1px solid #fecaca;">
                <span style="color:#6b7280;font-size:13px;font-weight:500;display:block;margin-bottom:2px;">WAS SCHEDULED FOR</span>
                <span style="color:#9ca3af;font-size:15px;text-decoration:line-through;">{{ date_time }}</span>
              </td></tr>
              {% if reason %}
              <tr><td style="padding:8px 0;">
                <span style="color:#6b7280;font-size:13px;font-weight:500;display:block;margin-bottom:2px;">REASON</span>
                <span style="color:#374151;font-size:14px;">{{ reason }}</span>
              </td></tr>
              {% endif %}
            </table>
          </td></tr>
        </table>
        <a href="{{ book_again_url }}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-size:14px;font-weight:600;">Book Again</a>
      </td></tr>
      <tr><td style="background:#f9fafb;padding:20px 40px;border-top:1px solid #e5e7eb;">
        <p style="margin:0;color:#9ca3af;font-size:12px;text-align:center;">Sent by {{ app_name }}</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
